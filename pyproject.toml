[project]
name = "content-engine"
version = "0.1.0"
description = "AI-powered YouTube content pipeline"
readme = "README.md"
requires-python = ">=3.12.11"
dependencies = [
    "temporalio>=1.0.0",
    "pydantic>=2.0.0",
    "boto3>=1.28.0",
    "psycopg>=3.1.0",
    "pytest>=7.0.0",
    "pyyaml>=6.0",
    "google-auth>=2.56.2",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.198.0",
    "whisperx>=3.8.6",
    "google-generativeai>=0.8.6",
    "elevenlabs>=2.61.0",
    "google-genai>=2.17.0",
    "openai>=2.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "hatchling>=1.25.0",
]

[project.scripts]
avatar-harness = "cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator", "contracts", "providers", "scripts"]
include = ["cli.py"]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring external services like PostgreSQL, MinIO, or Temporal"
]
