services:
  postgresql:
    container_name: temporal-postgresql
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/create_manifest_stage_records.sql:/docker-entrypoint-initdb.d/02-manifest.sql:ro
      - ./sql/create_stage_run_records.sql:/docker-entrypoint-initdb.d/03-telemetry.sql:ro
      - ./sql/create_registry_profiles.sql:/docker-entrypoint-initdb.d/04-registry.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.26.2
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: ${DB_PORT}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PWD: ${DB_PASSWORD}
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.32.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

  minio:
    container_name: minio
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-createbucket:
    image: minio/mc
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      ARTIFACT_BUCKET: ${ARTIFACT_BUCKET}
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 \$$S3_ACCESS_KEY_ID \$$S3_SECRET_ACCESS_KEY) do
        echo 'waiting for minio...' && sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing local/\$$ARTIFACT_BUCKET;
      echo 'bucket ready';
      exit 0;
      "

volumes:
  postgres-data:
  minio-data: