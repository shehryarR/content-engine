name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: temporal
          POSTGRES_PASSWORD: temporal
          POSTGRES_DB: content_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U temporal -d content_engine"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      minio:
        image: minio/minio
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        command: server /data --console-address ":9001"

    env:
      # PostgreSQL
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: content_engine
      DB_USER: temporal
      DB_PASSWORD: temporal

      # MinIO / S3
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION_NAME: us-east-1
      ARTIFACT_BUCKET: avatar-harness-poc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest tests/ -m "not integration" -v

      - name: Run contract linting
        run: uv run python scripts/contract_lint.py

      - name: Check schemas are in sync
        run: |
          uv run python scripts/export_schemas.py
          git diff --exit-code contracts/